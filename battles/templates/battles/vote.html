<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Голосование — {{ event.title }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.3em; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin: 0 0 10px; font-size: 1.1em; }
        .code { background: #f4f4f4; padding: 10px; border-radius: 4px; font-size: 0.8em; overflow-x: auto; max-height: 200px; }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }
        button:active { background: #388e3c; }
        .badge {
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            background: #e0e0e0;
            color: #555;
        }
    </style>
</head>
<body>
    {% csrf_token %}
    <h1>{{ event.title }}</h1>
    <p>Проголосуйте за лучшее решение. Один голос на устройство.</p>

    {% for sub in submissions %}
        <div class="card">
            <h2>{{ sub.team.name }}</h2>
            <div class="code"><pre>{{ sub.code_snapshot|truncatechars:300 }}</pre></div>

            {% if sub.has_voted %}
                <div class="badge">Вы уже голосовали</div>
            {% else %}
                <button hx-post="{% url 'cast_vote' sub.id %}"
                        hx-swap="outerHTML"
                        hx-target="this"
                        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                    Голосовать
                 </button>
            {% endif %}
        </div>
    {% empty %}
        <p>Решений пока нет.</p>
    {% endfor %}
</body>
</html>
